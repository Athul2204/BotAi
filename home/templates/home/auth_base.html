{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Botai{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}" />
  <script src="{% static 'assets/js/config.js' %}"></script>
  <link href="{% static 'assets/css/vendors.min.css' %}" rel="stylesheet" />
  <link href="{% static 'assets/css/app.min.css' %}" rel="stylesheet" />
</head>
<body>
  <div class="position-absolute top-0 end-0"><img src="{% static 'assets/images/auth-card-bg.svg' %}" class="auth-card-bg-img" alt="" /></div>
  <div class="position-absolute bottom-0 start-0" style="transform: rotate(180deg)"><img src="{% static 'assets/images/auth-card-bg.svg' %}" class="auth-card-bg-img" alt="" /></div>
  <div class="auth-box overflow-hidden align-items-center d-flex">
    <div class="container"><div class="row justify-content-center"><div class="col-xxl-5 col-md-6 col-sm-8">
      <div class="card p-4">
        <div class="auth-brand text-center mb-2">
          <a href="{% url 'index' %}" class="logo-dark"><img src="{% static 'assets/images/logo-black.png' %}" alt="Botai" /></a>
          <a href="{% url 'index' %}" class="logo-light"><img src="{% static 'assets/images/logo.png' %}" alt="Botai" /></a>
          {% block heading %}{% endblock %}
        </div>
        {% for m in messages %}
          <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} py-2">{{ m }}</div>
        {% endfor %}
        {% block form %}{% endblock %}
      </div>
      <p class="text-center text-muted mt-4 mb-0">© <script>document.write(new Date().getFullYear())</script> Botai</p>
    </div></div></div>
  </div>
  <script src="{% static 'assets/js/vendors.min.js' %}"></script>
  <script src="{% static 'assets/js/app.js' %}"></script>
</body>
</html>
