{% extends 'home/auth_base.html' %}
{% block title %}Sign In | Botai{% endblock %}
{% block heading %}
  <h4 class="fw-bold text-dark mt-3">Great to see you here 👋</h4>
  <p class="text-muted w-lg-75 mx-auto">Let’s get you signed in. Enter your email and password to continue.</p>
{% endblock %}
{% block form %}
<form method="post" class="mt-2">{% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Email address <span class="text-danger">*</span></label>
    <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus />
  </div>
  <div class="mb-3">
    <label class="form-label">Password <span class="text-danger">*</span></label>
    <input type="password" name="password" class="form-control" placeholder="••••••••" required />
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" checked />
    <label class="form-check-label" for="rememberMe">Keep me signed in</label>
  </div>
  <div class="d-grid"><button type="submit" class="btn btn-primary fw-semibold py-2">Sign In</button></div>
</form>
<p class="text-muted text-center mt-4 mb-0">New here? <a href="{% url 'signup' %}" class="text-decoration-underline fw-semibold">Create an account</a></p>
{% endblock %}
